<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Weather Next iPhone</title>
<style>
  :root{color-scheme:dark;--bg:#0b1020;--card:#151b33;--text:#eef3ff;--muted:#a9b3d0;--accent:#69b7ff;--good:#7ee2a8;--warn:#ffd166;--bad:#ff7b7b}
  *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top,#182149 0,var(--bg) 45%);color:var(--text);min-height:100vh}
  header{padding:18px 16px 10px}.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);margin:12px 0}
  input,select,button{width:100%;border:1px solid rgba(255,255,255,.18);background:#0e1530;color:var(--text);border-radius:14px;padding:13px 14px;font-size:16px;outline:none} input:focus,select:focus,button:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(105,183,255,.18)}
  button{background:linear-gradient(135deg,#2f7dff,#19c6ff);border:0;font-weight:700} button.secondary{background:#202a4d;border:1px solid rgba(255,255,255,.14);font-weight:600}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  #map{height:290px;border-radius:18px;border:1px solid rgba(255,255,255,.14);margin:12px 0}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-block;border-radius:999px;padding:4px 10px;background:rgba(105,183,255,.16);color:#bfe0ff;margin:2px 4px 2px 0;font-size:13px}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:12px}.big{font-size:54px;font-weight:800;line-height:1}.cond{font-size:20px;font-weight:700}.err{white-space:pre-wrap;color:#ffd3d3;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.25);border-radius:14px;padding:12px;display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.day{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px}.day h3{margin:0 0 8px;font-size:15px}.temp{font-size:22px;font-weight:800}.low{color:var(--muted);font-weight:700}
  details{margin-top:8px} summary{cursor:pointer;color:var(--accent)} pre{overflow:auto;background:#070b18;border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,.1);font-size:12px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0e1530;border:1px solid rgba(255,255,255,.15);padding:11px 14px;border-radius:999px;display:none;max-width:92vw;box-shadow:0 12px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
<header><div class="wrap"><h1 style="margin:0">Weather Next</h1><div class="muted small">Google Maps Platform Weather API • single-file iPhone page</div></div></header>
<main class="wrap">
  <section class="card" id="setup">
    <div class="row" style="grid-template-columns:1fr auto;align-items:end">
      <label class="small muted">API key<br><input id="apiKey" type="password" autocomplete="off" placeholder="Paste Google API key" /></label>
      <button id="saveKey" style="width:auto;padding:13px 16px">Save</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="small muted">Latitude<br><input id="lat" inputmode="decimal" placeholder="40.7128" /></label>
      <label class="small muted">Longitude<br><input id="lon" inputmode="decimal" placeholder="-74.0060" /></label>
    </div>
    <div class="row3" style="margin-top:10px">
      <button class="secondary" id="useLoc">Use my location</button>
      <select id="units" aria-label="Units"><option value="METRIC">°C / metric</option><option value="IMPERIAL">°F / imperial</option></select>
      <select id="days" aria-label="Days"><option>3</option><option selected>5</option><option>7</option><option>10</option></select>
    </div>
    <button id="load" style="margin-top:10px">Load forecast</button>
    <div class="small muted" style="margin-top:10px">Tip: on iPhone, tap the map to choose a point. Geolocation may require HTTPS hosting.</div>
  </section>

  <div id="err" class="err"></div>
  <div id="map"></div>

  <section class="card" id="currentCard" hidden>
    <div class="hero"><div><div class="muted small">Current conditions</div><div class="cond" id="curCond">—</div><div id="curPills"></div></div><div class="big" id="curTemp">—</div></div>
    <div class="small muted" id="curMeta"></div>
  </section>

  <section class="card" id="dailyCard" hidden>
    <h2 style="margin:0 0 10px;font-size:18px">Daily forecast</h2>
    <div class="grid" id="days"></div>
  </section>

  <details class="card"><summary>Raw API responses</summary><pre id="raw"></pre></details>
</main>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const state={key:localStorage.getItem('gmp_weather_key')||'',lat:40.7128,lon:-74.0060,map:null,marker:null};
$('apiKey').value=state.key;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',2600)}
function err(msg){const e=$('err'); if(!msg){e.style.display='none';e.textContent='';return} e.style.display='block';e.textContent=msg}
function num(v,unit=''){ if(v==null) return '—'; const n=(typeof v==='object')?(v.value??v.degrees??v.kph??v.metersPerSecond??v.percent):v; return `${Math.round(Number(n))}${unit}` }
function txt(x){ if(x==null) return ''; if(typeof x==='string') return x; return x.text||x.description||x.type||JSON.stringify(x) }
function cond(c){ return txt(c?.weatherCondition?.description) || txt(c?.weatherCondition) || c?.weatherCondition?.type || '—' }
async function j(url){ const r=await fetch(url); const data=await r.json().catch(()=>({})); if(!r.ok) throw new Error(`${r.status} ${r.statusText}\n${JSON.stringify(data,null,2)}`); return data }
function loadMap(){ if(state.map || !state.key) return; const s=document.createElement('script'); s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(state.key)}&loading=async&callback=initMap`; s.onerror=()=>err('Maps JavaScript API failed to load. Check that Maps JavaScript API is enabled and the key is valid.'); document.head.appendChild(s) }
window.initMap=function(){ err(''); state.map=new google.maps.Map($('map'),{center:{lat:state.lat,lng:state.lon},zoom:9,gestureHandling:'greedy',mapTypeControl:false,streetViewControl:false}); state.map.addListener('click',e=>{setPoint(e.latLng.lat(),e.latLng.lng()); loadWeather()}) ; setPoint(state.lat,state.lon) }
function setPoint(lat,lon){ state.lat=+lat; state.lon=+lon; $('lat').value=state.lat.toFixed(5); $('lon').value=state.lon.toFixed(5); if(state.map){ const p={lat:state.lat,lng:state.lon}; state.map.setCenter(p); if(!state.marker) state.marker=new google.maps.Marker({map:state.map,position:p,draggable:true}); else state.marker.setPosition(p); state.marker.addListener('dragend',()=>{const q=state.marker.getPosition(); setPoint(q.lat(),q.lng()); loadWeather()}) } }
async function loadWeather(){ err(''); const key=state.key; if(!key) return toast('Save an API key first'); const lat=+$('lat').value, lon=+$('lon').value, units=$('units').value, days=+$('days').value; if(!isFinite(lat)||!isFinite(lon)) return err('Enter valid latitude/longitude.'); setPoint(lat,lon); const base='https://weather.googleapis.com/v1'; const keyQ=`key=${encodeURIComponent(key)}&unitsSystem=${units}`; toast('Loading…'); try{ const cur=await j(`${base}/currentConditions:lookup?location.latitude=${lat}&location.longitude=${lon}&${keyQ}`); const fc=await j(`${base}/forecast/days:lookup?location.latitude=${lat}&location.longitude=${lon}&days=${days}&${keyQ}`); render(cur,fc); $('raw').textContent='CURRENT\n'+JSON.stringify(cur,null,2)+'\n\nFORECAST\n'+JSON.stringify(fc,null,2); } catch(e){ err(String(e.message||e)) } finally{ toast('Done') } }
function render(cur,fc){ const c=cur.currentConditions||cur; $('currentCard').hidden=false; $('dailyCard').hidden=false; $('curCond').textCondition=cond(c); $('curCond').textContent=cond(c); $('curTemp').textContent=num(c.temperature,'°'); $('curMeta').textContent=`${cur.timeZone?.id||''} • updated ${cur.updateTime||''}`; const pills=[]; if(c.feelsLikeTemperature!=null)pills.push(`feels ${num(c.feelsLikeTemperature,'°')}`); if(c.relativeHumidity!=null)pills.push(`humidity ${num(c.relativeHumidity,'%')}`); if(c.wind)pills.push(`wind ${txt(c.wind.speed)||num(c.wind.speed,'')} ${txt(c.wind.direction)||''}`); if(c.precipitation)pills.push(`precip ${num(c.precipitation.probability||c.precipitation,'%')}`); $('curPills').innerHTML=pills.map(p=>`<span class="pill">${p}</span>`).join(''); const days=fc.forecastDays||fc.days||[]; $('days').innerHTML=days.map(d=>`<div class="day"><h3>${d.date||d.displayDate||d.dayOfWeek||''}</h3><div class="temp">${num(d.maxTemperature,'°')} <span class="low">/ ${num(d.minTemperature,'°')}</span></div><div class="small">${cond(d.daytimeForecast||d)||cond(d)}</div><div class="small muted">${d.daytimeForecast?.precipitationProbability!=null?`precip ${num(d.daytimeForecast.precipitationProbability,'%')}`:''} ${d.daytimeForecast?.wind?.speed!=null?`wind ${num(d.daytimeForecast.wind.speed)}`:''}</div></div>`).join('') || '<div class="muted">No forecastDays in response.</div>' }
$('saveKey').onclick=()=>{state.key=$('apiKey').value.trim(); localStorage.setItem('gmp_weather_key',state.key); err(''); if(state.key){loadMap(); toast('Key saved locally on this device')} };
$('load').onclick=loadWeather; $('useLoc').onclick=()=>{ if(!navigator.geolocation) return toast('Geolocation unavailable'); navigator.geolocation.getCurrentPosition(p=>{setPoint(p.coords.latitude,p.coords.longitude); loadWeather()},e=>toast('Location denied: '+e.message),{enableHighAccuracy:true,timeout:8000})};
if(state.key) loadMap();
</script>
</body>
</html>
